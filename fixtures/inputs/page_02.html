<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>区域指标</title></head>
<body>
  <h1>区域指标示例</h1>
  <table id="regions">
    <caption>区域销售指标</caption>
    <thead>
      <tr>
        <th rowspan="2">区域</th>
        <th colspan="2">指标</th>
        <th rowspan="2">日期</th>
      </tr>
      <tr>
        <th>销售额</th>
        <th>同比</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td rowspan="2">华东</td>
        <td>1,000</td>
        <td>5%</td>
        <td>2026/2/3</td>
      </tr>
      <tr>
        <td>800</td>
        <td>-2.5%</td>
        <td>2026-02-04</td>
      </tr>
      <tr>
        <td>华南</td>
        <td>600.50</td>
        <td>0%</td>
        <td>2026年2月5日</td>
      </tr>
    </tbody>
  </table>
  <p>数据均为虚构示例。</p>
</body>
</html>
