<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>混合表格</title></head>
<body>
  <h1>混合表格示例</h1>

  <table class="too-narrow">
    <thead><tr><th>备注</th></tr></thead>
    <tbody>
      <tr><td>仅一列</td></tr>
      <tr><td>无法成为可抽取表格</td></tr>
    </tbody>
  </table>

  <table class="valid">
    <caption>示例指标表</caption>
    <thead>
      <tr><th>指标</th><th>数量</th><th>状态</th></tr>
    </thead>
    <tbody>
      <tr><td>示例指标甲</td><td>42</td><td>正常</td></tr>
      <tr><td>示例指标乙</td><td>7</td><td>停用</td></tr>
      <tr><td>示例指标丙</td><td>15</td><td>正常</td></tr>
    </tbody>
  </table>

  <table class="no-header">
    <tr><td>甲</td><td>乙</td><td>丙</td></tr>
    <tr><td>1</td><td>2</td><td>3</td></tr>
  </table>

  <p>该页面同时包含可采信和被过滤的表格。</p>
</body>
</html>
