<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>半规整表格</title></head>
<body>
  <div class="wrapper">
    <h1>半规整表格示例</h1>
    <p>第一行没有 th，只能依赖 header_hint_regex 判定表头。</p>
    <table>
      <tr>
        <td>编号</td>
        <td> 名称 </td>
        <td></td>
        <td>金额</td>
        <td>金额</td>
        <td>日期</td>
      </tr>
      <tr>
        <td>B-2001</td>
        <td>  示例
          记录 一 </td>
        <td>备注一</td>
        <td>1,200</td>
        <td>1,300</td>
        <td>2026-03-01</td>
      </tr>
      <tr>
        <td>B-2002</td>
        <td><span>示例记录二</span></td>
        <td>备注二</td>
        <td>1,300</td>
        <td>1,400</td>
        <td>2026/03/02</td>
      </tr>
      <tr>
        <td>B-2003</td>
        <td>示例记录三<br>补充说明</td>
        <td>备注三</td>
        <td>800</td>
        <td>950</td>
        <td>2026年3月3日</td>
      </tr>
      <tr>
        <td>B-2004</td>
        <td>示例记录四</td>
        <td>备注四</td>
        <td>900</td>
        <td>950</td>
        <td>2026-13-40</td>
      </tr>
    </table>
  </div>
</body>
</html>
